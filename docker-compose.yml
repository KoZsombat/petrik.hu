# The whole site: `docker compose up --build`.
#
#   client  nginx: the built website, and a reverse proxy for /api/ and
#           /uploads/ to the server - the only service published on a port.
#   server  Express + SQLite: the Hírkezelő and Szerkesztő API. Not reachable
#           from outside the compose network.
#   tunnel  optional Cloudflare tunnel to the client (DEPLOY.md step 7).
#
# Both images build from the repo root, because both apps import shared/.
# On a server (DEPLOY.md) the images are built on your own machine and copied
# over, then started with `docker compose up -d --no-build` - hence the fixed
# project and image names, so the copied images are found by name.
name: petrikhu

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: petrikhu-server
    environment:
      PNW_PORT: 4000
      # Set a real PNW_SESSION_SECRET in .env before exposing this beyond your
      # own machine - see .env.example.
      PNW_SESSION_SECRET: ${PNW_SESSION_SECRET:-petrik-news-workflow-dev-secret-change-me}
      # Off unless .env says true: a public site must not print working logins.
      PNW_SHOW_DEMO_LOGINS: ${PNW_SHOW_DEMO_LOGINS:-false}
      # Only read when the database is empty (first boot) - see apps/server/config.ts.
      PNW_SEED_PASSWORD: ${PNW_SEED_PASSWORD:-}
    volumes:
      # The SQLite database and uploaded images, kept on the host so
      # `docker compose down` / a rebuild never loses them - the same two
      # paths a local `npm run server` uses (and .gitignore excludes).
      - ./apps/server/data/db:/app/apps/server/data/db
      - ./apps/server/uploads:/app/apps/server/uploads
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: petrikhu-client
    ports:
      - '${PNW_PORT:-4000}:80'
    depends_on:
      - server
    restart: unless-stopped

  # Publishes the site on your Cloudflare domain through an outbound tunnel -
  # no open ports, HTTPS from Cloudflare. Its public hostname points at
  # http://client:80. Only started when .env contains COMPOSE_PROFILES=tunnel,
  # so a local `docker compose up` without a token is unaffected.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - client
    restart: unless-stopped
