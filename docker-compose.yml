# The whole site: `docker compose up --build`.
#
#   client  nginx: the built website, and a reverse proxy for /api/ and
#           /uploads/ to the server - the only service published on a port.
#   server  Express + SQLite: the Hírkezelő and Szerkesztő API. Not reachable
#           from outside the compose network.
#
# This is the file Launchpad scans (LAUNCHPAD.md), so it keeps two properties
# that matter there: no `profiles` (Launchpad deploys every service in the file
# and waits for each of them to be running) and no tunnel (Launchpad's own
# cloudflared + Traefik publish the site). The database is a named volume, not
# a bind mount, because a Launchpad deployment is a checkout of this
# repository - a bind mount would keep the live site's data inside a git
# working tree.
#
# Both images build from the repo root, because both apps import shared/.
name: petrikhu

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: petrikhu-server
    environment:
      PNW_PORT: 4000
      # Required. The repo's public dev default and an empty value are both
      # refused at startup (apps/server/config.ts, assertProductionConfig).
      PNW_SESSION_SECRET: ${PNW_SESSION_SECRET:?set PNW_SESSION_SECRET - openssl rand -hex 32}
      # Off unless .env says true: a public site must not print working logins.
      PNW_SHOW_DEMO_LOGINS: ${PNW_SHOW_DEMO_LOGINS:-false}
      # Required. Password of the three accounts seeded into an EMPTY database
      # (data/users-repo.ts). Without it, a fresh deployment would get the demo
      # passwords that are public in this repository.
      PNW_SEED_PASSWORD: ${PNW_SEED_PASSWORD:?set PNW_SEED_PASSWORD for the first boot of an empty database}
    volumes:
      # The whole site is this one SQLite file: news, pages, accounts, the menu,
      # every uploaded image and the mirrored media (data/media-repo.ts). A
      # named volume, so a redeploy - or Launchpad checking the repository out
      # again - cannot take it along. Back it up; see LAUNCHPAD.md.
      - petrik-db:/app/apps/server/data/db
    restart: unless-stopped
    # Deliberately no `ports`: nginx reaches the API at server:4000 on the
    # compose network, and Launchpad removes published ports anyway.

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: petrikhu-client
    ports:
      - '${PNW_PORT:-4000}:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  petrik-db:
