# Serves the built SPA and forwards the API to the server container.
#
# The container itself only speaks HTTP: TLS ends at Cloudflare (through the
# tunnel) or at Launchpad's Traefik. Cloudflare keeps the visitor's scheme in
# CF-Visitor, and that header survives the tunnel hop, so the API can still see
# "HTTPS" and mark the login cookie Secure (server/index.ts). A local
# `docker compose up` sends no CF-Visitor and stays on http.
map $http_cf_visitor $pnw_forwarded_proto {
    default   $scheme;
    "~*https" https;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirects (e.g. /fonts -> /fonts/) keep the host's own port instead of
    # nginx's :80 - the container is published on 4000 locally.
    absolute_redirect off;

    # Uploads through the Hírkezelő and the Szerkesztő (8 MB limit in multer).
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pnw_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://server:4000;
    }

    # The mirrored images and PDFs live in the server's database too - the
    # client image carries none of them (AGENT.md 6.25).
    location /media/ {
        proxy_pass http://server:4000;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every route of the SPA (/nyolcadikos/, /szerkeszto/, /<new page>/ ...) is index.html.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
