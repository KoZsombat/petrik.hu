<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The site icon, in the four sizes WordPress generated for it, and in the
      order the mirror lists them. The title here is only what a tab shows
      before React mounts; src/lib/useDocumentTitle.ts sets the real one for
      each route.
    -->
    <link rel="icon" href="/media/wp-content/uploads/2020/08/cropped-logo-nagy-32x32.png" sizes="32x32" />
    <link rel="icon" href="/media/wp-content/uploads/2020/08/cropped-logo-nagy-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/media/wp-content/uploads/2020/08/cropped-logo-nagy-180x180.png" />
    <meta name="msapplication-TileImage" content="/media/wp-content/uploads/2020/08/cropped-logo-nagy-270x270.png" />
    <title>Petrik Lajos Két Tanítási Nyelvű Technikum</title>
  </head>
  <!--
    The body classes WordPress put on every page of this site. They are not
    decoration: the theme keys real layout on them - et_header_style_left and
    et_fixed_nav drive the header, et_pb_gutters3 the grid, et_transparent_nav
    the space under the header. Only the ones identical on all 345 mirrored
    pages are here; the per-page ones are set by src/lib/useBodyClass.ts.
  -->
  <body class="et-db et_divi_theme wp-theme-Divi et_button_left et_cover_background et_fixed_nav et_fullwidth_secondary_nav et_header_style_left et_pb_button_helper_class et_pb_footer_columns_1_4__1_2 et_pb_gutter et_pb_gutters3 et_primary_nav_dropdown_animation_fade et_secondary_nav_dropdown_animation_fade et_secondary_nav_enabled et_secondary_nav_two_panels et_show_nav et_smooth_scroll et_transparent_nav">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
